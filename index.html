function renderMercado(d){let seg=group(d,'seg');chart('chSeg','doughnut',seg.map(x=>x[0]),[{data:seg.map(x=>x[1]),backgroundColor:PALETTE}]);let provs=group(d,'prov').slice(0,5).map(x=>x[0]);let segs=seg.slice(0,4).map(x=>x[0]);chart('chSegProv','bar',provs,segs.map((s,i)=>({label:s,data:provs.map(p=>sum(d.filter(r=>r.prov===p&&r.seg===s))),backgroundColor:PALETTE[i]})),{scales:{x:{stacked:true},y:{stacked:true}},plugins:{valueLabels:false}});chart('chPrecioSeg','bar',segs,[{label:'Precio promedio',data:segs.map(s=>avg(d.filter(r=>r.seg===s),'precio',true)),backgroundColor:PALETTE.slice(0,segs.length)}]);}
function renderGobierno(d,total){let g=group(d,'gobierno'), actual=d.filter(r=>norm(r.gobierno).includes('ACTUAL')), anteriores=d.filter(r=>!norm(r.gobierno).includes('ACTUAL')), visAct=sum(actual.filter(r=>r.tipo==='VIS')), vipAct=sum(actual.filter(r=>r.tipo==='VIP')), visAnt=sum(anteriores.filter(r=>r.tipo==='VIS')), vipAnt=sum(anteriores.filter(r=>r.tipo==='VIP'));$('kpiGob').innerHTML=kpiHTML([['Viviendas Gob. Anteriores',fmt(sum(anteriores)),pct(sum(anteriores),total)],['Viviendas Gob. Actual',fmt(sum(actual)),pct(sum(actual),total)],['Registros Gob. Anteriores',fmt(anteriores.length),pct(anteriores.length,d.length)],['Registros Gob. Actual',fmt(actual.length),pct(actual.length,d.length)],['VIS Gob. Anteriores',fmt(visAnt),'Viviendas VIS'],['VIS Gob. Actual',fmt(visAct),'Viviendas VIS'],['VIP Gob. Anteriores',fmt(vipAnt),'Viviendas VIP'],['VIP Gob. Actual',fmt(vipAct),'Viviendas VIP']]);let compLabels=['Viviendas','Viviendas VIS','Viviendas VIP'], compMax=Math.max(sum(actual),sum(anteriores),visAct,visAnt,vipAct,vipAnt);chart('chGob','bar',compLabels,[{label:'Gobierno Actual',data:[sum(actual),visAct,vipAct],backgroundColor:COLORS.blue,maxBarThickness:28},{label:'Gobiernos Anteriores',data:[-sum(anteriores),-visAnt,-vipAnt],backgroundColor:COLORS.gray,maxBarThickness:28}],{indexAxis:'y',plugins:{valueLabels:{absolute:true},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(Math.abs(c.raw))}`}}},scales:{x:{min:-compMax*1.12,max:compMax*1.12,grid:{color:v=>v.tick.value===0?'#94a3b8':'#e5e7eb'},ticks:{callback:v=>fmt(Math.abs(v))}},y:{grid:{display:false}}}});let years=[...new Set(d.map(r=>{let y=dateYear(r.fecha);return y}).filter(Boolean))].sort();let gs=g.map(x=>x[0]);chart('chGobAnio','line',years,gs.map((gg,i)=>({label:gg,data:years.map(y=>sum(d.filter(r=>r.gobierno===gg&&dateYear(r.fecha)===y))),borderColor:[COLORS.blue,COLORS.gray][i],backgroundColor:[COLORS.blue,COLORS.gray][i],pointRadius:4,pointHoverRadius:5,tension:.32})))}
function renderCalidad(d,coord,coordProjects){let projects=projectRows(d), valid=coordProjects.length, pending=projects.filter(p=>!p.hasValidCoord), fields=raw[0]?Object.keys(raw[0]).length:0;$('kpiCal').innerHTML=kpiHTML([['Proyectos con coordenada válida',fmt(valid),pct(valid,projects.length)],['Proyectos sin coordenada válida',fmt(pending.length),pct(pending.length,projects.length)],['Total de proyectos',fmt(projects.length),'NRO DE REGISTRO únicos'],['Viviendas en proyectos georreferenciados',fmt(sum(coordProjects)),'Suma de viviendas de proyectos válidos'],['Campos detectados',fmt(fields),'Se leen dinámicamente del Sheet']]);renderMap('mapCal','cal',coordProjects,'tipo');let pend={};pending.forEach(p=>{pend[p.prov]=(pend[p.prov]||0)+1});barList('pendientesProv',Object.entries(pend).sort((a,b)=>b[1]-a[1]));}
function downloadCSV(){let d=filtered();let csv=Papa.unparse(d);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='base_filtrada_vis_vip.csv';a.click();}
function loadSheet(){Papa.parse(`${CSV_URL}&_=${Date.now()}`,{download:true,header:false,skipEmptyLines:true,complete:res=>{raw=rowsToObjects(res.data);data=raw.map(parseRow).filter(r=>r.prov&&r.viv>0);$('loader').classList.add('hide');$('app').classList.remove('hide');fillFilters();updateAll();if(firstLoad){firstLoad=false;showSec('resumen');}},error:e=>{$('loader').innerHTML='No se pudo cargar Google Sheets. Verifica que el archivo esté publicado o compartido como público.'}})}
function init(){renderShell();loadSheet();setInterval(loadSheet,120000);}
init();
</script>
